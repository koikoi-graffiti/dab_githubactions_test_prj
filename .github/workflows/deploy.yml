name: Deploy to Databricks

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Databricks CLI
        run: |
          python -m pip install --upgrade pip
          pip install databricks-cli
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Configure CLI
        run: |
          printf "%s\n%s\n" "${DATABRICKS_HOST}" "${DATABRICKS_TOKEN}" | databricks configure --token
          databricks jobs configure --version=2.1

      - name: Upload notebooks to Databricks workspace
        run: |
          mkdir -p /tmp/databricks-deploy
          if [ -d notebooks ]; then
            databricks workspace import_dir ./notebooks /Workspace/databricks_project --overwrite || true
          else
            echo "No notebooks directory"
          fi

      - name: Create or update validation job
        shell: bash
        run: |
          set -x
          if [ -f jobs/job_definitions/ci_cd_validation_job.json ]; then
            echo "Job definition:"
            cat jobs/job_definitions/ci_cd_validation_job.json

            JOB_NAME=$(jq -r '.name' jobs/job_definitions/ci_cd_validation_job.json)
            echo "Attempting to create job: ${JOB_NAME}"
            CREATE_OUT=$(databricks jobs create --json-file jobs/job_definitions/ci_cd_validation_job.json || true)
            echo "Create output: ${CREATE_OUT}"

            JOB_ID=$(echo "$CREATE_OUT" | jq -r '.job_id' 2>/dev/null || true)
            if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "null" ]; then
              echo "Created job $JOB_ID"
              databricks jobs run-now --job-id "$JOB_ID"
              exit 0
            fi

            echo "Job create did not return a job_id; checking existing jobs..."
            LIST_OUT=$(databricks jobs list --output JSON || true)
            echo "Job list output: ${LIST_OUT}"

            EXISTING=$(echo "$LIST_OUT" | jq -r --arg name "$JOB_NAME" '
              if type == "array" then .[]
              elif .jobs then .jobs[]
              else empty end
              | select((.settings.name // .name) == $name)
              | .job_id
            ' | head -n 1)

            if [ -n "$EXISTING" ]; then
              echo "Found existing job $EXISTING"
              databricks jobs run-now --job-id "$EXISTING"
              exit 0
            fi

            echo "No job created or found for $JOB_NAME"
            echo "Check: token permissions, workspace access, and cluster ID"
            exit 1
          else
            echo "No Databricks job definition found"
            exit 1
          fi