name: Deploy to Databricks

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Databricks CLI
        run: |
          python -m pip install --upgrade pip
          pip install databricks-cli

      - name: Configure Databricks CLI
        run: |
          printf "%s\n%s\n" "${DATABRICKS_HOST}" "${DATABRICKS_TOKEN}" | databricks configure --token

      - name: Upload notebooks to Databricks workspace
        run: |
          if [ -d notebooks ]; then
            echo "Uploading notebooks to /Workspace/databricks_project..."
            databricks workspace import_dir ./notebooks /Workspace/databricks_project --overwrite
            echo "✓ Notebooks uploaded successfully"
          else
            echo "✗ No notebooks directory found"
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "========== Deployment Complete =========="
          echo ""
          echo "✓ Notebooks deployed to Databricks Workspace"
          echo "  Location: /Workspace/databricks_project/notebooks/"
          echo ""
          echo "Job Definition:"
          echo "  File: jobs/job_definitions/ci_cd_validation_job.json"
          echo "  Name: ci_cd_validation_job"
          echo ""
          echo "Next steps to create the job:"
          echo "  1. Open Databricks UI"
          echo "  2. Go to Workflows → Jobs"
          echo "  3. Click 'Create Job'"
          echo "  4. Configure using the job definition"
          echo ""
          echo "=========================================="
